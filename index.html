<script>
/* ===== SAFE + GACOR ADS LOADER =====
   - No auto-load
   - Load after click only
   - Delay bertahap
   - Satu kali per sesi
*/
let adsLoaded = sessionStorage.getItem("adsLoaded") === "1";

function loadAdsSafely(){
  if(adsLoaded) return;
  adsLoaded = true;
  sessionStorage.setItem("adsLoaded","1");

  // 1) MULTI TAG (CPM / Mixed)
  setTimeout(()=>{
    const s1 = document.createElement("script");
    s1.src = "https://quge5.com/88/tag.min.js";
    s1.dataset.zone = "205836";
    s1.async = true;
    s1.setAttribute("data-cfasync","false");
    document.body.appendChild(s1);
  }, 600);

  // 2) POPUNDER (delayed)
  setTimeout(()=>{
    const s2 = document.createElement("script");
    s2.src = "https://al5sm.com/tag.min.js";
    s2.dataset.zone = "10524355";
    document.body.appendChild(s2);
  }, 1400);
}

// Interaksi manusia: klik link
document.querySelectorAll(".monetag").forEach(btn=>{
  btn.addEventListener("click", e=>{
    e.preventDefault();
    loadAdsSafely();
    setTimeout(()=>{ window.location.href = btn.dataset.link; }, 700);
  });
});
</script>
